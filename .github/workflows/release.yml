name: Publish Foundry module release

on:
  push:
    branches: [main]
    paths:
      - 'module.json'
      - 'scripts/**'
      - 'data/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'tests/**'
      - 'build_icons.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build vector icons and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 build_icons.py
          node --check scripts/main.js
          node tests/smoke.cjs
      - name: Prepare complete Foundry module ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wod20-combat-library
          cp module.json README.md CHANGELOG.md dist/wod20-combat-library/
          cp -r scripts data tests assets dist/wod20-combat-library/
          (cd dist && zip -qr ../wod20-combat-library.zip wod20-combat-library)
          unzip -t wod20-combat-library.zip >/dev/null
          test "$(unzip -Z1 wod20-combat-library.zip | grep -c 'assets/icons/.*\.svg$')" -eq 69
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wod20-combat-library.zip --clobber
          else
            gh release create "$TAG" wod20-combat-library.zip \
              --target "$GITHUB_SHA" \
              --title "WoD20 Combat Library ${TAG}" \
              --notes "Adds 69 bundled SVG icons mapped to all 142 entries, including icon-only updates for matching World Items. No actor inventory changes. See CHANGELOG.md; live Foundry testing pending."
          fi
