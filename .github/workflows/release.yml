name: Publish Foundry module release
on:
  push:
    branches: [main]
    paths:
      - 'module.json'
      - 'scripts/**'
      - 'data/**'
      - 'assets/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_ICONS.md'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Expand bundled Game-Icons artwork and test
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq assets/game-icons.zip -d assets
          node --check scripts/main.js
          node tests/smoke.cjs
      - name: Prepare full installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/wod20-combat-library/assets/icons
          cp module.json README.md CHANGELOG.md THIRD_PARTY_ICONS.md RELEASE-NOTES.md dist/wod20-combat-library/
          cp -r scripts data tests docs dist/wod20-combat-library/
          cp assets/icons/*.svg dist/wod20-combat-library/assets/icons/
          (cd dist && zip -qr ../wod20-combat-library.zip wod20-combat-library)
          unzip -t wod20-combat-library.zip >/dev/null
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" wod20-combat-library.zip --clobber
          else
            gh release create "$TAG" wod20-combat-library.zip \
              --target "$GITHUB_SHA" \
              --title "WoD20 Combat Library ${TAG}" \
              --notes "Completes the approved Combat Library artwork sheet for matching existing Items: 63 additional catalog entries now use 34 illustrated concepts. Corrected Throw and Joint Lock art remains. Back up world data, Update All, hard-refresh Ctrl+Shift+R, and review the GM icon preview. No Item statistics or custom art replaced; live Foundry validation pending."
          fi